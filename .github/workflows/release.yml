name: Release Tagged Builds

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.7

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        shell: bash
        run: |
          app_path=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo 'macOS app bundle not found.' >&2
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/ip-optimizer-macos-v${{ steps.version.outputs.version }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/ip-optimizer-windows-v${{ steps.version.outputs.version }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android local properties
        shell: bash
        run: |
          flutter_bin=$(command -v flutter)
          flutter_sdk=$(cd "$(dirname "$flutter_bin")/.." && pwd)
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$android_sdk" ]; then
            echo 'Android SDK path is not available on the runner.' >&2
            exit 1
          fi
          {
            printf 'flutter.sdk=%s\n' "$flutter_sdk"
            printf 'sdk.dir=%s\n' "$android_sdk"
            printf 'flutter.buildMode=release\n'
          } > android/local.properties

      - name: Verify Android toolchain
        run: |
          flutter --version
          java -version
          flutter doctor -v

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ip-optimizer-android-v${{ steps.version.outputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
      - build-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract latest changelog section
        id: notes
        shell: bash
        run: |
          awk '
            /^## (\[[^]]+\]|[0-9]{4}-[0-9]{2}-[0-9]{2})/ {
              if (started) exit
              started=1
            }
            started { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo 'Failed to extract latest changelog section.' >&2
            exit 1
          fi

      - name: Validate version tag
        shell: bash
        run: |
          expected_tag="v${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $expected_tag." >&2
            exit 1
          fi

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "IP Optimizer $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            artifacts/android-release/*.apk \
            artifacts/macos-release/*.zip \
            artifacts/windows-release/*.zip
